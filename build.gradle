plugins {
    id 'org.jetbrains.intellij.platform' version '2.19.0'
    id 'java'
    id 'antlr'
    id 'scala'
    id 'net.researchgate.release' version '3.2.0'
    id "io.freefair.lombok" version "9.8.2"
    id "maven-publish"
    id "signing"
}

//sourceCompatibility = '11'  // Set Java version here
//targetCompatibility = '11'  // Set Java version here

group 'io.github.zhangshengshan'

repositories {

    mavenLocal()
    // add aliyun huawei repo
    maven {
        url "https://repo.huaweicloud.com/repository/maven/"
    }
    maven {
        url "https://maven.aliyun.com/repository/public"
    }

    mavenCentral()
    maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
    }
    maven {
        url "https://oss.sonatype.org/content/repositories/releases"
    }
    maven {
        url "https://oss.sonatype.org/service/local/repositories/releases/content"
    }

    // gradle-intellij-plugin 2.x: IDE 与捆绑插件的仓库
    intellijPlatform {
        defaultRepositories()
    }
}
sourceSets {
    main {
        // Java 先编译，Scala 再编译（scalac 能看到 javac 产物，反之不行）。
        // Java 源码不再直接引用 Scala object，跨语言调用统一走 misc.ScalaBridge 接口，
        // 从而避免 compileJava <-> compileScala 的任务环。
        java {
            srcDirs = ['src/main/java', 'src/main/gen']
        }
        scala {
            srcDirs = ['src/main/scala']
        }
    }
}

// gradle-intellij-plugin 2.x 的 buildPlugin 会把 runtimeClasspath 依赖一起放进 zip 的 lib/，
// 所以默认 jar 保持普通瘦包；需要"单个 jar 直接丢进 plugins 目录"时用 fatJar
tasks.register('fatJar', Jar) {
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // 依赖里带签名文件的 jar 合并后会触发 "Invalid signature file digest"，
    // 单文件包必须剔除 META-INF 下的签名文件
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/*.EC', 'META-INF/SIG-*'
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// 让 ./gradlew build 也产出 build/libs/myhive-<version>-all.jar，可直接单文件丢进 plugins 目录
tasks.named('assemble') {
    dependsOn 'fatJar'
}

dependencies {
    intellijPlatform {
        // 默认从 JetBrains 仓库下载 2026.3 平台（build 263，对应 RustRover 2026.3）；
        // 想复用本机已解压的 IDE（省 1.5G 下载）可加 -PlocalIdePath=/path/to/ideaIU-2026.3
        def localIde = providers.gradleProperty('localIdePath').orNull
        if (localIde) {
            local(localIde)
        } else {
            intellijIdeaUltimate('2026.3')
        }
        // 2026.3 起正则表达式支持被拆成独立的平台模块（lib/intellij.regexp.jar），
        // HiveTableSurrounder 用到 org.intellij.lang.regexp.RegExpFileType，需要显式声明。
        bundledModule('com.intellij.modules.regexp')
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.0'
    implementation 'org.antlr:antlr4:4.11.1'
    implementation "org.antlr:antlr4-intellij-adaptor:0.1"
    implementation 'org.scala-lang:scala-library:2.13.18'
    implementation 'com.github.vertical-blank:sql-formatter:2.0.3'
    implementation 'io.github.zhangshengshan:mygraphapp_2.13:0.1.8'
    // mygraphapp中包含此依赖，此处不再需要，防止冲突
//    implementation 'io.github.zhangshengshan:mycommongraph_2.13:0.0.12'
    implementation 'com.intellij:forms_rt:7.0.3'
    implementation 'com.google.code.gson:gson:2.10'

    // for requests ospath and json parsesupport
    implementation 'com.lihaoyi:requests_2.13:0.8.0'
    implementation 'com.lihaoyi:ujson_2.13:1.4.2'
    implementation 'com.lihaoyi:os-lib_2.13:0.7.8'
    implementation 'com.lihaoyi:upickle_2.13:1.4.2'

    implementation 'mysql:mysql-connector-java:8.0.28'
    implementation 'com.typesafe.slick:slick_2.13:3.3.3'
    implementation 'com.typesafe.slick:slick-hikaricp_2.13:3.3.3'

    // Apache Calcite 核心库
    implementation 'org.apache.calcite:calcite-core:1.35.0' // 请根据实际情况替换为最新版本
}

generateGrammarSource {
    include("**/ANTLRv4*.g4")

    arguments += [
            "-package", "org.antlr.intellij.plugin.parser",
            "-lib", "src/main/antlr/org/antlr/intellij/plugin/parser",
            "-Xexact-output-dir"
    ]
}

// See https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html
intellijPlatform {
    buildSearchableOptions = false
    instrumentCode = true

    pluginConfiguration {
        id = 'org.example.MyHive'
        name = 'DataStudio'
        description = '''
            DataStudio：Hive / Doris SQL 开发辅助工具<br/>
            提供语法高亮、格式化、表结构抽取、数据对比、血缘分析等能力。
        '''
        ideaVersion {
            sinceBuild = '262'
            untilBuild = '263.*'
        }
        vendor {
            name = 'MyDataStudio'
            url = 'https://github.com/zhangshengshan/MyOpenHivePlugin'
            email = 'alphabetago@163.com'
        }
        changeNotes = ''
    }
}


test {
    useJUnitPlatform()
}

// IntelliJ Platform 2026.3 (build 263) 的平台 jar 是 Java 25 (class file v69) 编译的，
// 必须用 JDK 25 编译插件，否则报 "错误的类文件 ... 版本 69.0, 应为 65.0"
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

lombok {
    version = '1.18.48'
}

release {
    ignoredSnapshotDependencies = ["io.github.zhangshengshan:mygraphapp_2.13"]
}

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
    archiveClassifier = "sources"
}

publishing {
    publications {
        Sonatype(MavenPublication) {
            from components.java
            artifact sourceJar
            pom {
                name = "Demo"
                description = "A demonstration of Maven POM customization"
                url = "https://www.example.com/project"
                licenses {
                    license {
                        name = "The Apache License, Version 2.0"
                        url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
                    }
                }
                developers {
                    developer {
                        id = "zhangshengshan"
                        name = "alphabetago"
                        email = "alphabetago@163.com"
                    }
                }
                scm {
                    connection = "scm:svn:https://subversion.example.com/svn/project/trunk/"
                    developerConnection = "scm:git:ssh:githubcom:zhangshengshan/MyOpenHivePlugin.git"
                    url = "https://github.com/zhangshengshan/MyOpenHivePlugin/tree/main"
                }
            }
        }
    }
    repositories {
        // The repository to publish to, Sonatype/MavenCentral
        maven {
            // This is an arbitrary name, you may also use "mavencentral" or
            // any other name that's descriptive for you
            name = "datastudio"
            def releasesRepoUrl = "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://oss.sonatype.org/content/repositories/snapshots/"

            // You only need this if you want to publish snapshots, otherwise just set the URL
            // to the release repo directly
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            // The username and password we've fetched earlier
            credentials {
                username = OSSRHUSERNAME
                password = OSSRHPASSWORD
            }
        }

        maven {
            name = "aliyunxiao"
            def release_url = 'https://packages.aliyun.com/maven/repository/2440159-release-ZPowfH/'
            def snapshot_url = 'https://packages.aliyun.com/maven/repository/2440159-snapshot-iMOtTE/'
            url = version.endsWith('SNAPSHOT') ? snapshot_url : release_url
            credentials {
                username = ALIYUNUSERNAME
                password = ALIYUNPASSWORD
            }
        }

        maven {
            name = "MyOpenHivePlugin"
            url = uri("https://maven.pkg.github.com/zhangshengshan/MyOpenHivePlugin")

            credentials {
                username = GITHUBUSERNAME
                password = GITHUBPASSWORD
            }
        }

    }
}

